[package]
name = "vault-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1"
uuid = { version = "1", features = ["v7"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "macros"] }
chrono = "0.4"
tokio = { version = "1", features = ["fs", "io-util"] }
anyhow = "1"
