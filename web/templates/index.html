<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ganjina</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; margin-top: 1.5rem; }
    .grid img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
    form { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Ganjina</h1>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept="image/*" required>
    <button type="submit">Upload</button>
  </form>
  <div class="grid">
    {% for asset in assets %}
    <img src="/blobs/{{ asset.hash }}" alt="{{ asset.original_filename }}">
    {% endfor %}
  </div>
</body>
</html>
